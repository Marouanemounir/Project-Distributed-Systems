spring.application.name=ebank-service
server.port=8057
server.address=${BIND_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${SERVICE_IP:127.0.0.1}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
spring.datasource.url=jdbc:h2:mem:accounts-db
spring.jpa.open-in-view=false
spring.cloud.openfeign.client.config.customer-service.connect-timeout=1500
spring.cloud.openfeign.client.config.customer-service.read-timeout=2000
resilience4j.circuitbreaker.instances.customerService.sliding-window-size=4
resilience4j.circuitbreaker.instances.customerService.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.customerService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.customerService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.customerService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.customerService.ignore-exceptions=feign.FeignException$NotFound
