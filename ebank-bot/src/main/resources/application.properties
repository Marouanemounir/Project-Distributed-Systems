spring.application.name=ebank-bot
server.port=8058
server.address=${BIND_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${SERVICE_IP:127.0.0.1}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.jersey.enabled=false
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o}
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=15s
spring.ai.mcp.client.streamable-http.connections.customer.url=${CUSTOMER_MCP_URL:http://localhost:8056}
spring.ai.mcp.client.streamable-http.connections.customer.endpoint=/mcp
spring.ai.mcp.client.streamable-http.connections.ebank.url=${EBANK_MCP_URL:http://localhost:8057}
spring.ai.mcp.client.streamable-http.connections.ebank.endpoint=/mcp
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
discord.bot.token=${DISCORD_TOKEN:}
spring.mvc.async.request-timeout=120s
